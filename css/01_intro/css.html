<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- link style -->
    <link rel="stylesheet" href="./sytle.css">
    <!-- embedding-style -->
    <!-- <style>
        h2 {
            color: blue;
        }
    </style> -->
</head>
<body>
    <!-- 
    1. css(cascading style sheet)
    - html과 같은 구조화된 문서를 어떠헥 화면에 그릴지 선언하는 언어
    - 단독 사용x -> html과 항상 함꼐 사용되어야한다.

    2. css 선언 방법
    선택자 {
    속성1: 값;
    속성2: 값;
    }
    선택자(selector): 스타일을 적용하고자하는 html 태그를 지정하는 방식
    속성: 선택자로 지정할 html 태그에 변경할 스타일을 지정
    값: 속성에 적용할 값, 크기, 생상... 지정

    3. html에 css 적용 방식(우선순위 존재)
        1. inline-style: 태그에 style을 정의
        2. embedding-style: html head에 style 정의
        3. link-style: html 외부 css 파일을 로드해서 사용'
        Inline > embedding > link
    -->

    <h1>어쩌고1</h1>
    <h1>어쩌고2</h1>
    <h2>어쩌고 저쩌고</h2>
    <h2>어쩌고 저쩌고</h2>
    <!-- inline-style -->
    <h3 style="color: green;"></h3>
</body>
</html>
